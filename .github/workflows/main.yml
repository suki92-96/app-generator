name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build EXE
      run: |
        pyinstaller --onefile main.py --name "Smart_Username_Generator"

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Smart_Username_Generator_Windows
        path: dist/Smart_Username_Generator.exe
